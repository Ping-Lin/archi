"services":
  "gateway":
    "build":
      "context": "."
      "dockerfile": "src/mock/Dockerfile"
    "environment":
      "SERVICE_ID": "gateway"
      "PORT": "8080"
      "DEPENDENCIES": "{\"identity\":\"http://identity:8080\",\"orders\":\"http://orders:8080\",\"catalog\":\"http://catalog:8080\"}"
    "ports":
      - "127.0.0.1:8100:8080"
    "read_only": true
    "tmpfs":
      - "/tmp"
    "cap_drop":
      - "ALL"
    "security_opt":
      - "no-new-privileges:true"
  "orders":

name: Verify architecture
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  contract-and-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run check:helm
      - run: npm run check:analysis
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run check:analysis
          npm run dev > /tmp/archi-server.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/browser.mjs
          node tests/analysis-browser.mjs
          node tests/graph-browser.mjs
          npm run analyze:logistics
          ARCHI_GRAPH_FIXTURE=logistics node tests/graph-browser.mjs
          npm run analyze:system
          node tests/system-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-previews
          path: artifacts/
          if-no-files-found: warn
